[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "namichess"
version = "0.0.0"
description = "Human-comprehensible chess analysis and training"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "namichess/interfaces/web/assets/pieces/mpchess/LICENSE",
]
dependencies = [
    "chess==1.11.2",
    "python-chess==1.999",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["namichess*"]

[tool.setuptools.package-data]
namichess = [
    "interfaces/web/assets/pieces/mpchess/*.svg",
    "interfaces/web/assets/pieces/mpchess/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
